name: Idea / Предложение
description: Suggest an improvement / Предложить улучшение
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve? / Какую задачу хотите решить?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How should it work? / Как это должно работать?
