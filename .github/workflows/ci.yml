name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (translations, docs, binaries)
        run: ./build.sh
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test ./...
      - name: Interface tests
        run: node --test test/*.mjs
