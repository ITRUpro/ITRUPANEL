# ITRUPANEL: {{.Domain}}
# Файл перезаписывается панелью. Свои правила — в {{.Custom}}
{{.SecurityHTTP}}server {
    server_tokens off;
    listen 80{{if .Default}} default_server{{end}};
    listen [::]:80{{if .Default}} default_server{{end}};
{{- if .SSL}}
    listen 443 ssl{{if .OldHTTP2}} http2{{end}};
    listen [::]:443 ssl{{if .OldHTTP2}} http2{{end}};
{{- if not .OldHTTP2}}
    http2 on;
{{- end}}
    ssl_certificate     {{.Crt}};
    ssl_certificate_key {{.Key}};
    ssl_protocols TLSv1.2 TLSv1.3;
{{- end}}
    server_name {{.Names}};
    root {{.Root}};
    index {{.Index}};
    charset utf-8;
    access_log {{.AccessLog}};
    error_log  {{.ErrorLog}} warn;
    client_max_body_size {{.MaxBody}}m;
    {{.SecurityServer}}

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/itrupanel-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    # Проверка Let’s Encrypt всегда доходит до файла: перенаправления ниже и в своих правилах её не трогают.
    if ($request_uri ~ "^/\.well-known/acme-challenge/") {
        break;
    }
{{- if .DefaultHosts}}
    # Сайт по умолчанию: заход по IP-адресу или чужому имени перебрасывает на домен сайта.
    if ($host !~* "{{.DefaultHosts}}") {
        return 302 {{.DefaultURL}}$request_uri;
    }
{{- end}}
{{- if .Suspended}}

    location / {
        types {}
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 503 "{{.SuspendedPage}}";
    }
{{- else}}
{{- if .RedirectHTTPS}}

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }
{{- end}}
{{- if eq .WWWRedirect "from_www"}}

    if ($host = www.{{.Domain}}) {
        return 301 $scheme://{{.Domain}}$request_uri;
    }
{{- else if eq .WWWRedirect "to_www"}}

    if ($host = {{.Domain}}) {
        return 301 $scheme://www.{{.Domain}}$request_uri;
    }
{{- end}}
{{- if .Gzip}}

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml font/ttf;
{{- end}}

{{- if .TemplateRules}}

    # Шаблон сайта: {{.TemplateName}}
{{.TemplateRules}}
{{- end}}

    include {{.Custom}};
{{- if .WebBackend}}

{{- if not .CustomRootLocation}}
    location / {
        proxy_pass http://127.0.0.1:{{.BackendPort}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
{{- end}}
{{- if .Expires}}

    location ~* \.(?:jpe?g|png|gif|webp|avif|svg|ico|css|js|mjs|woff2?|ttf|otf|eot|mp4|webm|mp3)$ {
        expires {{.Expires}};
{{- if .SecurityLog}}
        {{.SecurityLog}}
{{- else}}
        access_log off;
{{- end}}
{{- if .Apache}}
        try_files $uri @backend;
{{- else}}
        proxy_pass http://127.0.0.1:{{.BackendPort}};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
{{- end}}
    }

    location @backend {
        proxy_pass http://127.0.0.1:{{.BackendPort}};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
{{- end}}

    location ~ /\.(?!well-known) {
        deny all;
    }
{{- else if eq .Mode "proxy"}}

{{- if not .CustomRootLocation}}
    location / {
        proxy_pass {{.ProxyTo}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $itru_connection_upgrade;
        proxy_read_timeout 300;
    }
{{- end}}
{{- else}}
{{- if .Expires}}

    location ~* \.(?:jpe?g|png|gif|webp|avif|svg|ico|css|js|mjs|woff2?|ttf|otf|eot|mp4|webm|mp3)$ {
        expires {{.Expires}};
{{- if .SecurityLog}}
        {{.SecurityLog}}
{{- else}}
        access_log off;
{{- end}}
        try_files $uri {{if .Fallback}}{{.Fallback}}{{else}}=404{{end}};
    }
{{- end}}

{{- if not .CustomRootLocation}}
    location / {
        try_files $uri $uri/ {{if .Fallback}}{{.Fallback}}{{else}}=404{{end}};
    }
{{- end}}
{{- if .PHP}}

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:{{.Sock}};
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
{{- end}}

    location ~ /\.(?!well-known) {
        deny all;
    }
{{- end}}
{{- end}}
}
