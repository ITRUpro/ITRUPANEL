# ITRUPANEL: {{.Domain}}
docRoot {{.Root}}/
enableGzip 0
index {
  useServer 0
  indexFiles {{.Index}}
  autoIndex 0
}
errorlog {{.Log}} {
  useServer 0
  logLevel WARN
  rollingSize 10M
}
extprocessor php_{{.Domain}} {
  type fcgi
  address uds:/{{.Sock}}
  maxConns 10
  initTimeout 60
  retryTimeout 0
  persistConn 1
  respBuffer 0
  autoStart 0
}
scripthandler {
  add fcgi:php_{{.Domain}} php
}
rewrite {
  enable 1
  autoLoadHtaccess 1
}
context / {
  type NULL
  location {{.Root}}/
  allowBrowse 1
  rewrite {
    enable 1
    inherit 1
  }
}
