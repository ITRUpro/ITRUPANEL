; ITRUPANEL: {{.Domain}} (PHP {{.Version}}). Файл перезаписывается панелью.
[{{.Pool}}]
user = {{.User}}
group = {{.User}}
listen = {{.Sock}}
listen.owner = {{.WebUser}}
listen.group = {{.WebUser}}
listen.mode = 0660
pm = ondemand
pm.max_children = {{.MaxChildren}}
pm.process_idle_timeout = 30s
pm.max_requests = 500
chdir = /
; open_basedir задаёт панель: .user.ini, перенесённый из другой панели (например, aaPanel с
; open_basedir=/www/wwwroot/...), иначе запрещал бы PHP открывать скрипты сайта
php_admin_value[open_basedir] = /
catch_workers_output = yes
php_admin_value[error_log] = {{.Home}}/data/logs/{{.Domain}}.php.log
php_admin_flag[log_errors] = on
php_admin_value[upload_tmp_dir] = {{.Home}}/data/tmp
php_admin_value[session.save_path] = {{.Home}}/data/tmp
php_admin_value[sys_temp_dir] = {{.Home}}/data/tmp
php_value[upload_max_filesize] = {{.MaxBody}}M
php_value[post_max_size] = {{.MaxBody}}M
{{- range $k, $v := .Ini}}
php_value[{{$k}}] = {{$v}}
{{- end}}
